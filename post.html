</nav><div style="

"><input placeholder="Поиск..." name="search" id="search" style="
    border: none;

"><button style="

">Искать по сайту
</button></div></header>
  <main class="content-box">
    <div id="article-loader">Загрузка...</div>
    <article id="article-content" style="display: none;"></article>
    <div id="article-not-found" style="display: none;">
      <h2>Статья не найдена</h2>
      <p>Проверь правильность ссылки.</p>
    </div>
  </main>

  <script>
  const loadPosts = async () => {
    const response = await fetch('./api/blogposts.json');
    const posts = await response.json();
    return posts;
  };
  loadPosts().then(posts => {

  const urlParams = new URLSearchParams(window.location.search);
  const titleEncoded = urlParams.get('n');

  if (!titleEncoded) {
    showNotFound();
  } else {
    try {
      const title = decodeURIComponent(titleEncoded);
      const post = posts[title];

      if (post) {
        document.title = `${post.title} — блог меня, wuj1av =I`;
        
        let html = `
          <div class="article-meta">
            <i class="fa-regular fa-calendar"></i> ${post.date}
          </div>
          <h1 class="article-title">${post.title}</h1>
        `;

        if (post.image) {
          html += `<div style="background-image: url(${post.image})" alt="${post.title}" class="article-image"></div>`;
        }

        html += `<div class="article-body">${post.content}</div>`;
        
        document.getElementById('article-content').innerHTML = html;
        document.getElementById('article-loader').style.display = 'none';
        document.getElementById('article-content').style.display = 'block';
      } else {
        showNotFound();
      }
    } catch (e) {
      showNotFound();
    }
  }

  function showNotFound() {
    document.getElementById('article-loader').style.display = 'none';
    document.getElementById('article-not-found').style.display = 'block';
  }
  });
</script>
<footer style="padding: 2rem 0px;font-family: &quot;Arial&quot;;text-align: center;width: 100%;color: #b9b9b9;background: #414141;">Футер сайта
