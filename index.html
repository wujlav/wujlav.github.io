<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wuj1avdev — блог о программировании</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-color: whitesmoke;
      margin: 0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
    }
    
    .bg {
      position: absolute;
      z-index: -9999999;
      width: 100%;
      height: 20rem;
      background: #1c787d;
      box-shadow: 0px 4px 8px 0px rgba(34, 60, 80, 0.2);
    }
    
    header {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5rem;
      background: transparent;
    }
    
    .logo {
      font-size: 2rem;
      font-family: cursive;
      color: white;
    }
    
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 3rem;
      color: white;
    }
    
    nav a {
      text-decoration: none;
      color: inherit;
      font-family: system-ui;
      font-size: 1.3rem;
    }
    
    .search-container {
      display: flex;
      align-items: center;
    }
    
    .search-container input {
      border: none;
      border-radius: 10px 0px 0px 10px;
      padding: 8px 13px;
      font-family: inherit;
      font-size: 1rem;
    }
    
    .search-container button {
      padding: 10px 13px;
      border: none;
      background: linear-gradient(45deg, #800cc9, #2418d9);
      border-radius: 0px 10px 10px 0px;
      font-family: inherit;
      color: white;
      cursor: pointer;
    }
    
    .content-box {
      width: 67rem;
      box-shadow: 0 0 16px 12px rgba(34, 60, 80, 0.2);
      background: white;
      padding: 2rem;
      margin-top: 1rem;
    }
    
    .blog-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    .blog-title {
      font-family: "Sitka Heading", serif;
      font-size: 3rem;
      margin: 0;
      color: #333;
    }
    
    .blog-description {
      color: #666;
      font-size: 1.2rem;
    }
    
    .posts-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }
    
    .post-card {
      background: #f9f9f9;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .post-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(34, 60, 80, 0.3);
    }
    
    .post-image {
      height: 180px;
      background-size: cover;
      background-position: center;
    }
    
    .post-content {
      padding: 1.5rem;
    }
    
    .post-meta {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    
    .post-title {
      font-family: "Sitka Heading", serif;
      font-size: 1.5rem;
      margin: 0 0 1rem;
      color: #333;
    }
    
    .post-excerpt {
      color: #555;
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    
    .read-more {
      display: inline-block;
      color: #1c787d;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }
    
    .read-more:hover {
      color: #2418d9;
    }
    
    .loading {
      text-align: center;
      padding: 3rem;
      color: #888;
    }
    
    footer {
      padding: 2rem 0;
      font-family: "Arial";
      text-align: center;
      width: 100%;
      color: #b9b9b9;
      background: #414141;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  
  <header>
    <div class="logo">wuj1avdev</div>
    <nav>
      <ul>
        <li><a href="/">Главная</a></li>
        <li><a href="/about">Продукты</a></li>
        <li><a href="/services">Я в соцсетях</a></li>
      </ul>
    </nav>
    <div class="search-container">
      <input type="text" placeholder="Поиск..." id="search">
      <button onclick="searchPosts()">Искать по сайту</button>
    </div>
  </header>
  
  <main class="content-box">
    <div class="blog-header">
      <h1 class="blog-title">Мой блог о программировании</h1>
      <p class="blog-description">Здесь я делюсь своими проектами, мыслями и опытом в программировании</p>
    </div>
    
    <div id="posts-container" class="posts-container">
      <div class="loading">Загрузка постов...</div>
    </div>
  </main>
  
  <footer>
    <p>Футер сайта</p>
  </footer>

  <script>
    const loadPosts = async () => {
      try {
        const response = await fetch('./api/blogposts.json');
        const posts = await response.json();
        return posts;
      } catch (error) {
        console.error('Ошибка загрузки постов:', error);
        return {};
      }
    };
    
    const renderPosts = (posts) => {
      const container = document.getElementById('posts-container');
      
      if (Object.keys(posts).length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #888;">Пока нет постов в блоге</p>';
        return;
      }
      
      let html = '';
      
      // Сортируем посты по дате (сначала новые)
      const sortedPosts = Object.entries(posts).sort((a, b) => {
        return new Date(b[1].date) - new Date(a[1].date);
      });
      
      sortedPosts.forEach(([title, post]) => {
        const encodedTitle = encodeURIComponent(title);
        const excerpt = post.content.substring(0, 150) + '...';
        
        html += `
          <article class="post-card">
            ${post.image ? `<div class="post-image" style="background-image: url(${post.image})"></div>` : ''}
            <div class="post-content">
              <div class="post-meta">
                <i class="fa-regular fa-calendar"></i> ${post.date}
              </div>
              <h2 class="post-title">${post.title}</h2>
              <p class="post-excerpt">${excerpt}</p>
              <a href="/post?n=${encodedTitle}" class="read-more">Читать далее →</a>
            </div>
          </article>
        `;
      });
      
      container.innerHTML = html;
    };
    
    const searchPosts = () => {
      const searchTerm = document.getElementById('search').value.toLowerCase();
      if (!searchTerm) return;
      
      // Здесь можно добавить логику поиска
      alert('Поиск пока не реализован. Будет добавлен позже!');
    };
    
    // Загрузка постов при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
      loadPosts().then(posts => {
        renderPosts(posts);
      });
    });
    
    // Поиск по Enter
    document.getElementById('search').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchPosts();
      }
    });
  </script>
</body>
</html>
